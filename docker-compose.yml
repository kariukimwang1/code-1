version: '3.8'

services:
  app:
    image: node:18-alpine
    container_name: miner-dapp
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXTAUTH_URL=http://localhost:3000
      - NEON_POSTGRES_URL=postgresql://postgres:password@postgres:5432/miner_dapp
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - postgres
      - redis
    command: sh -c "npm install && npm run dev"

  postgres:
    image: postgres:15-alpine
    container_name: miner-dapp-db
    environment:
      - POSTGRES_DB=miner_dapp
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: miner-dapp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  adminer:
    image: adminer
    container_name: miner-dapp-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data: